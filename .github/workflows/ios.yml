name: iOS unsigned build

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: '빌드할 스킴. 오류 재현용으로 RNFBStorage처럼 팟 하나만 빠르게 빌드할 수 있다'
        default: DalRyoTemp

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Firebase 12.10(RNFirebase 24 고정 버전)은 Xcode 16.2+를 요구하고, Xcode 26.4(Swift 6.3) Release 빌드의
  # Auth/Functions 크래시는 12.12~12.13에서야 고쳐졌다. macos-latest는 Xcode가 갑자기 바뀌므로 러너와 함께 고정한다
  XCODE_VERSION: '16.4'
  BUNDLE_ID: com.dalryo.app

jobs:
  build:
    runs-on: macos-15
    # Podfile에서 React Native 코어를 소스 빌드하므로 사전 빌드 때보다 오래 걸린다
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gemfile.lock이 Git에 없으므로 bundler-cache 대신 직접 설치한다
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Ruby gems
        run: bundle install --jobs 4 --retry 3

      - name: Install JS dependencies
        run: npm ci

      # GoogleService-Info.plist는 Git에 없으므로 Secret(IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64)에서 복원한다
      - name: Restore GoogleService-Info.plist
        env:
          PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PLIST_BASE64" || { echo "::error::Secret IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 is empty"; exit 1; }
          PLIST=ios/DalRyoTemp/GoogleService-Info.plist
          printf '%s' "$PLIST_BASE64" | tr -d '[:space:]' | base64 --decode > "$PLIST"
          plutil -lint "$PLIST" || { echo "::error::Secret is not a valid plist (base64 of the whole file is required)"; exit 1; }
          actual=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$PLIST")
          if [ "$actual" != "$BUNDLE_ID" ]; then
            echo "::error::plist BUNDLE_ID ($actual) != $BUNDLE_ID. Use the iOS app's GoogleService-Info.plist registered for $BUNDLE_ID"
            exit 1
          fi

      # Xcode 단계보다 먼저 JS 번들링 오류(import 누락, 에셋 확장자 등)를 확인한다
      - name: Verify JS bundle
        run: |
          mkdir -p "$RUNNER_TEMP/jsbundle"
          npx react-native bundle \
            --platform ios --dev false --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/jsbundle/main.jsbundle" \
            --assets-dest "$RUNNER_TEMP/jsbundle"

      - name: Install Pods
        working-directory: ios
        run: bundle exec pod install --repo-update

      # 사전 빌드 React 코어가 다시 켜지면 RNFirebase 모듈 컴파일이 실패하므로 xcodebuild 전에 막는다
      - name: Verify React Native is built from source
        working-directory: ios
        run: |
          if grep -E "React-Core-prebuilt|ReactNativeDependencies" Podfile.lock; then
            echo "::error::Prebuilt React Native core/dependencies are enabled. Check RCT_USE_PREBUILT_RNCORE / RCT_USE_RN_DEP in ios/Podfile"
            exit 1
          fi

      # Hermes 팟은 Debug 바이너리로 설치되고 Release 빌드 도중 폴더를 지우고 다시 푼다.
      # 이 교체가 다른 팟 컴파일과 겹치지 않도록 xcodebuild 전에 같은 스크립트로 미리 교체해 둔다
      - name: Switch Hermes to Release
        working-directory: ios/Pods
        run: |
          set -eo pipefail
          shopt -s nullglob
          tarballs=(hermes-engine-artifacts/hermes-ios-*-release.tar.gz)
          if [ ${#tarballs[@]} -ne 1 ]; then
            echo "::warning::Release Hermes tarball not found (${#tarballs[@]}); the Xcode build phase will switch it"
            exit 0
          fi
          version=$(basename "${tarballs[0]}" | sed -E 's/^hermes-ios-(.+)-release\.tar\.gz$/\1/')
          node "$GITHUB_WORKSPACE/node_modules/react-native/sdks/hermes-engine/utils/replace_hermes_version.js" \
            -c Release -r "$version" -p "$PWD"
          test -d hermes-engine/destroot/Library/Frameworks/universal/hermesvm.xcframework \
            || { echo "::error::Hermes Release switch failed"; exit 1; }

      - name: Build Release (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/DalRyoTemp.xcworkspace \
            -scheme "${{ inputs.scheme || 'DalRyoTemp' }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | xcbeautify --renderer github-actions

      # 로그가 길어 오류가 묻히므로 실패 시 error 줄만 모아 보여 준다
      - name: Summarize build errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          first=$(grep -n -m1 -E "error:" "$LOG" | cut -d: -f1 || true)
          if [ -n "$first" ]; then
            echo "=== 첫 오류 앞뒤 (line $first) ==="
            sed -n "$((first > 60 ? first - 60 : 1)),$((first + 5))p" "$LOG"
          fi
          echo "=== error 줄 목록 ==="
          grep -n -E "error:|\*\* BUILD FAILED|fatal error|ld: " "$LOG" | head -50 || true
          tail -n 40 "$RUNNER_TEMP/xcodebuild.log" || true

      - name: Package IPA
        if: ${{ (inputs.scheme || 'DalRyoTemp') == 'DalRyoTemp' }}
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/DalRyoTemp.app
          test -d "$APP" || { echo "::error::$APP not found"; ls build/Build/Products/*; exit 1; }
          test -f "$APP/main.jsbundle" || { echo "::error::main.jsbundle missing in app"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DalRyoTemp-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        if: ${{ (inputs.scheme || 'DalRyoTemp') == 'DalRyoTemp' }}
        with:
          name: DalRyoTemp-unsigned-ipa
          path: DalRyoTemp-unsigned.ipa
          retention-days: 7

      # 실패 시 원인 파악용 로그. 빌드 로그는 길어서 앞부분 대신 파일로 받는다
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ios/Podfile.lock
            ~/Library/Logs/CocoaPods/*.log
          if-no-files-found: ignore
          retention-days: 7
