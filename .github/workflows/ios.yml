name: iOS unsigned build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install JS dependencies
        run: npm ci

      # GoogleService-Info.plist는 Git에 없으므로 Secret(IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64)에서 복원한다
      - name: Restore GoogleService-Info.plist
        env:
          PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          test -n "$PLIST_BASE64" || { echo "Secret IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 is empty"; exit 1; }
          echo "$PLIST_BASE64" | base64 --decode > ios/DalRyoTemp/GoogleService-Info.plist

      - name: Install Pods
        working-directory: ios
        run: bundle exec pod install

      - name: Build Release (unsigned)
        run: |
          xcodebuild \
            -workspace ios/DalRyoTemp.xcworkspace \
            -scheme DalRyoTemp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DalRyoTemp.app Payload/
          zip -qry DalRyoTemp-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DalRyoTemp-unsigned-ipa
          path: DalRyoTemp-unsigned.ipa
          retention-days: 7
